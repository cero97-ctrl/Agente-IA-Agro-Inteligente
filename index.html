<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Agrónomo IA</title>
    <style>
        /* Reset global para evitar overflow por padding/borders */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100dvh; /* dvh maneja mejor la barra de dir en movil */
            background-color: #c8e6c9;
            margin: 0;
            overflow-x: hidden;
        }

        #main-container {
            display: flex;
            justify-content: center;
            width: 95%;
            max-width: 1200px;
            /* Aumentado para mostrar ambos paneles */
            gap: 20px;
        }

        #page-title {
            font-size: 2.5em;
            font-weight: bold;
            color: #4a4a4a;
            margin: 20px 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        #chat-container {
            flex: 1;
            /* Ocupa el espacio flexible */
            min-width: 300px;
            height: 80vh;
            border: 1px solid #ccc;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            background-color: #f9f9f9;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Estilo para cuando se arrastra un archivo */
        #chat-container.drag-over {
            border: 2px dashed #007bff;
            background-color: #f0f8ff;
        }

        #chat-box {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            border-bottom: 1px solid #ccc;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        #input-area {
            flex-direction: column;
            display: flex;
            padding: 10px;
        }

        #user-input {
            flex-grow: 1;
            border: 1px solid #ccc;
            border-radius: 15px;
            padding: 10px;
        }

        #input-controls {
            display: flex;
            width: 100%;
        }

        #preview-container {
            display: none;
            padding: 5px 10px;
            background-color: #f1f1f1;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        #send-button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 10px 15px;
            margin-left: 10px;
            cursor: pointer;
        }

        #upload-btn {
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 10px 15px;
            margin-right: 5px;
            cursor: pointer;
            font-size: 1.2em;
        }

        .message {
            margin-bottom: 15px;
        }

        .user-message {
            text-align: right;
            color: #0056b3;
        }

        .bot-message {
            text-align: left;
            color: #333;
        }

        .message p {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 80%;
            white-space: pre-wrap;
            /* Mantiene los saltos de línea del bot */
        }

        .user-message p {
            background-color: #e7f3ff;
        }

        .bot-message p {
            background-color: #f1f1f1;
        }

        #status-panel {
            width: 350px;
            /* Ancho fijo para el panel */
            height: 80vh;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: block;
            /* Asegurar que se muestre */
        }

        @media (max-width: 768px) {
            body {
                -webkit-tap-highlight-color: transparent;
            }

            #main-container {
                flex-direction: column;
                width: 100%;
                padding: 0 8px;
                align-items: center;
                gap: 12px;
            }

            #page-title {
                font-size: 1.6em;
                margin: 10px 0 5px;
            }

            #chat-container {
                min-width: unset;
                width: 100%;
                height: auto;
                min-height: 60vh; /* Para que al inicio el chat ocupe al menos media pantalla */
                box-shadow: none; /* Mejor reflow */
            }

            #chat-box {
                padding: 12px;
                overflow-y: visible; /* Elimina scroll anidado (nested scrolling) */
            }

            #status-panel {
                width: 100%;
                height: auto;
                max-height: none; /* Permitir que crezca con su contenido */
                padding: 15px;
                overflow-y: visible; /* Elimina scroll anidado */
                box-shadow: none;
                margin-bottom: 20px;
            }

            #user-input {
                font-size: 16px; /* Evita zoom automático en iOS */
                padding: 12px;
            }

            #send-button {
                padding: 12px 18px;
                font-size: 1em;
                min-height: 44px;
            }

            #upload-btn {
                padding: 12px 14px;
                min-height: 44px;
                min-width: 44px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .message p {
                max-width: 90%;
                font-size: 0.95em;
            }

            #role-btn,
            #help-btn {
                padding: 12px;
                font-size: 1em;
                min-height: 44px;
            }

            .crop-card {
                padding: 8px;
                font-size: 0.9em;
            }
        }

        @media (max-width: 480px) {
            #page-title {
                font-size: 1.3em;
                margin: 8px 0 4px;
            }

            #chat-container {
                min-height: 50vh;
            }

            #chat-box {
                padding: 8px;
            }

            #input-area {
                padding: 6px;
            }

            #user-input {
                padding: 10px;
                border-radius: 12px;
            }

            #send-button {
                padding: 10px 14px;
                border-radius: 12px;
                font-size: 0.9em;
            }

            #upload-btn {
                padding: 10px 12px;
                font-size: 1em;
            }

            .message p {
                max-width: 95%;
                padding: 8px 12px;
                font-size: 0.9em;
            }

            #status-panel {
                padding: 12px;
            }

            #status-panel h2 {
                font-size: 1.1em;
            }
        }

        .crop-card {
            border: 1px solid #eee;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .crop-card.alert {
            border-left: 5px solid #dc3545;
        }

        .crop-card.ok {
            border-left: 5px solid #28a745;
        }

        /* Botón de cambio de Rol */
        #role-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #8B4513;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
            /* Transición rápida para efecto mecánico */
            box-shadow: 0 5px #5a2d0c;
            /* Sombra sólida para efecto 3D */
            position: relative;
            top: 0;
        }

        #role-btn:active {
            box-shadow: 0 2px #5a2d0c;
            /* La sombra se reduce al presionar */
            top: 3px;
            /* El botón baja físicamente */
        }

        .role-productor {
            background-color: #6c757d;
            color: white;
        }

        .role-agronomo {
            background-color: #28a745;
            color: white;
        }

        /* Botón de Ayuda */
        #help-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #0056b3;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            transition: all 0.1s;
            box-shadow: 0 5px #004085;
            position: relative;
            top: 0;
        }

        #help-btn:active {
            box-shadow: 0 2px #004085;
            top: 3px;
        }

        /* Indicador de escribiendo */
        .typing-indicator {
            display: none;
            margin: 10px 15px;
            color: #666;
            font-style: italic;
            font-size: 0.9em;
        }

        .typing-indicator span {
            animation: blink 1.4s infinite both;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0% {
                opacity: 0.2;
            }

            20% {
                opacity: 1;
            }

            100% {
                opacity: 0.2;
            }
        }
    </style>
</head>

<body>

    <h1 id="page-title">SINAI 90/10</h1>
    <div id="main-container">
        <div id="chat-container">
            <div id="chat-box">
                <div id="typing-indicator" class="typing-indicator">
                    Analizando<span>.</span><span>.</span><span>.</span>
                </div>
            </div>
            <div id="input-area">
                <div id="preview-container">
                    <span id="file-name">Imagen seleccionada</span>
                    <button onclick="clearFile()"
                        style="color:red; border:none; background:none; cursor:pointer;">(x)</button>
                </div>
                <div id="input-controls">
                    <button id="upload-btn" title="Subir imagen">📷</button>
                    <input type="file" id="file-input" accept="image/*" style="display: none;">
                    <input type="text" id="user-input" placeholder="Escribe o arrastra una imagen aquí...">
                    <button id="send-button">Enviar</button>
                </div>
            </div>
        </div>

        <div id="status-panel">
            <h2>📡 Estado de Cultivos</h2>
            <button id="role-btn" class="role-productor" onclick="toggleRole()">👤 Rol: Productor</button>
            <button id="help-btn" onclick="showHelp()">❓ Ayuda</button>
            <div id="crops-status-container">
                <p>Cargando datos...</p>
            </div>
        </div>
    </div>

    <script>
        console.log("Agente Agro UI v1.4 - Persistencia de Chat");
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const cropsStatusContainer = document.getElementById('crops-status-container');
        const API_URL_CHAT = './chat'; // Usar ruta relativa para despliegue
        const API_URL_HISTORY = './chat/history';
        const API_URL_CROPS = './status/crops';
        const chatContainer = document.getElementById('chat-container');
        const previewContainer = document.getElementById('preview-container');
        const fileNameSpan = document.getElementById('file-name');
        const typingIndicator = document.getElementById('typing-indicator');
        const roleBtn = document.getElementById('role-btn');
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');

        let selectedFile = null;
        let currentRole = 'productor';

        // Gestión de Sesión (Persistencia)
        let sessionId = localStorage.getItem('agro_session_id');
        if (!sessionId) {
            sessionId = 'sess-' + Math.random().toString(36).substr(2, 9) + '-' + Date.now();
            localStorage.setItem('agro_session_id', sessionId);
        }

        function toggleRole() {
            if (currentRole === 'productor') {
                currentRole = 'agronomo';
                roleBtn.textContent = '👨‍🌾 Rol: Agrónomo (Experto)';
                roleBtn.className = 'role-agronomo';
            } else {
                currentRole = 'productor';
                roleBtn.textContent = '👤 Rol: Productor';
                roleBtn.className = 'role-productor';
            }
        }

        function showHelp() {
            userInput.value = "/ayuda";
            sendMessage();
        }

        async function sendMessage() {
            const messageText = userInput.value.trim();
            if (messageText === '' && !selectedFile) return;

            // Muestra el mensaje del usuario en el chat
            let displayMsg = messageText;
            if (selectedFile) displayMsg += ` [Imagen: ${selectedFile.name}]`;

            appendMessage(displayMsg, 'user');
            userInput.value = '';

            // Preparar datos como FormData para soportar archivos
            const formData = new FormData();
            formData.append('message', messageText || "Analiza esta imagen"); // Si no hay texto, enviar default
            formData.append('role', currentRole);
            formData.append('session_id', sessionId);
            if (selectedFile) {
                formData.append('file', selectedFile);
            }

            // Limpiar selección visual inmediatamente
            clearFile();

            // Mostrar indicador de carga y moverlo al final
            chatBox.appendChild(typingIndicator);
            typingIndicator.style.display = 'block';
            if (window.innerWidth <= 768) {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            } else {
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            try {
                // Envía el mensaje al back-end
                const response = await fetch(API_URL_CHAT, {
                    method: 'POST',
                    body: formData, // Fetch detecta FormData y pone el Content-Type correcto automáticamente
                });

                if (!response.ok) {
                    throw new Error(`Error del servidor: ${response.status}`);
                }

                const data = await response.json();
                // Muestra la respuesta del bot
                appendMessage(data.reply, 'bot');

            } catch (error) {
                console.error('Error al contactar al agente:', error);
                appendMessage('Lo siento, no pude conectarme con el servidor. Revisa la consola.', 'bot');
            } finally {
                // Ocultar indicador siempre, haya éxito o error
                typingIndicator.style.display = 'none';
            }
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            const p = document.createElement('p');
            p.textContent = text;
            messageDiv.appendChild(p);
            chatBox.appendChild(messageDiv);
            
            // Auto-scroll adaptativo según disposición
            if (window.innerWidth <= 768) {
                // En móviles todo el doc scrollea
                window.scrollTo({
                    top: document.body.scrollHeight,
                    behavior: 'smooth'
                });
            } else {
                // En desktop el chat-box scrollea
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        async function loadChatHistory() {
            try {
                const response = await fetch(`${API_URL_HISTORY}?session_id=${sessionId}`);
                const history = await response.json();

                chatBox.innerHTML = ''; // Limpiar chat actual
                // Re-agregar indicador (oculto)
                chatBox.appendChild(typingIndicator);

                if (history.length === 0) {
                    appendMessage("¡Hola! Soy tu asistente agrónomo. 🌱\n\nEstoy aquí para responder tus dudas sobre agricultura y biología vegetal.\n\nEscribe /ayuda para ver los comandos disponibles.", "bot");
                } else {
                    history.forEach(msg => {
                        // Mapear 'user'/'bot' a las clases CSS
                        appendMessage(msg.content, msg.role);
                    });
                }
            } catch (error) {
                console.error("Error cargando historial:", error);
                // Fallback mensaje inicial
                appendMessage("¡Hola! Soy tu asistente agrónomo. (Offline)", "bot");
            }
        }

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // --- Botón de Cámara (Móvil/Desktop) ---
        uploadBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                handleFile(fileInput.files[0]);
            }
        });

        // --- Lógica de Drag & Drop ---

        // Prevenir comportamiento por defecto
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            chatContainer.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Efectos visuales
        chatContainer.addEventListener('dragover', () => chatContainer.classList.add('drag-over'));
        ['dragleave', 'drop'].forEach(eventName => {
            chatContainer.addEventListener(eventName, () => chatContainer.classList.remove('drag-over'));
        });

        // Manejar el archivo soltado
        chatContainer.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0 && files[0].type.startsWith('image/')) {
                handleFile(files[0]);
            } else {
                alert("Por favor, arrastra solo archivos de imagen.");
            }
        });

        function handleFile(file) {
            selectedFile = file;
            fileNameSpan.textContent = `📷 Imagen lista: ${file.name}`;
            previewContainer.style.display = 'block';
        }

        window.clearFile = function () {
            selectedFile = null;
            previewContainer.style.display = 'none';
            fileInput.value = ''; // Limpiar el input oculto también
        }

        async function updateCropsStatus() {
            try {
                const response = await fetch(API_URL_CROPS);
                const data = await response.json();

                if (data.status === 'error') {
                    cropsStatusContainer.innerHTML = `<p style="color: red;">${data.message}</p>`;
                    return;
                }

                cropsStatusContainer.innerHTML = ''; // Limpiar contenedor

                if (Object.keys(data).length === 0) {
                    cropsStatusContainer.innerHTML = '<p>No hay cultivos registrados.</p>';
                    return;
                }

                for (const cropId in data) {
                    const crop = data[cropId];
                    const isAlert = crop.humidity < 30 || crop.temperature > 35 || crop.pest_detected;
                    const cardClass = isAlert ? 'alert' : 'ok';

                    const card = document.createElement('div');
                    card.className = `crop-card ${cardClass}`;
                    card.innerHTML = `
                    <strong>${crop.name} (${cropId})</strong><br>
                    💧 Humedad: ${crop.humidity}%<br>
                    🌡️ Temp: ${crop.temperature}°C<br>
                    🐛 Plaga: ${crop.pest_detected || 'Ninguna'}
                `;
                    cropsStatusContainer.appendChild(card);
                }

            } catch (error) {
                console.error('Error al obtener estado de cultivos:', error);
                cropsStatusContainer.innerHTML = '<p style="color: red;">No se pudo conectar al servidor de estado.</p>';
            }
        }

        // Actualizar el estado al cargar la página y luego cada 5 segundos
        document.addEventListener('DOMContentLoaded', () => {
            updateCropsStatus();
            // Aumentamos el intervalo a 15 segundos para reducir el "ruido" en los logs
            setInterval(updateCropsStatus, 15000);
            loadChatHistory(); // Cargar historial al iniciar
        });

    </script>

</body>

</html>
